name: Resource Cleanup
on: workflow_dispatch

concurrency:
  group: resource-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Clean and verify string resources
        run: |
          python3 <<'PY'
          from collections import defaultdict, deque
          from dataclasses import dataclass
          from fnmatch import fnmatchcase
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          APP_SOURCE_DIRECTORY = Path("app/src")
          EXCLUDED_DIRECTORIES = {".git", ".gradle", "build"}
          STRING_RESOURCE_PATTERN = re.compile(
              r"<!--.*?-->|"
              r"(?P<element><(?P<tag>string|item)(?=[\s/>])"
              r"(?P<attributes>(?:\"[^\"]*\"|'[^']*'|[^'\">])*)"
              r"(?:\s*/>|>.*?</(?P=tag)\s*>))",
              re.DOTALL | re.IGNORECASE,
          )
          NAME_ATTRIBUTE_PATTERN = re.compile(
              r"\bname\s*=\s*(?:\"(?P<double>[^\"]*)\"|'(?P<single>[^']*)')",
              re.DOTALL,
          )
          TYPE_ATTRIBUTE_PATTERN = re.compile(
              r"\btype\s*=\s*(?:\"(?P<double>[^\"]*)\"|'(?P<single>[^']*)')",
              re.DOTALL,
          )
          NON_TRANSLATABLE_PATTERN = re.compile(
              r"\btranslatable\s*=\s*(['\"])false\1",
              re.IGNORECASE,
          )
          CONFLICT_MARKER_PATTERN = re.compile(
              r"^(?P<marker><{7,}|[|]{7,}|={7,}|>{7,})(?: .*)?$"
          )
          STRING_REFERENCE_PATTERN = re.compile(
              r"(?:\bR\.string\.|@(?:[a-zA-Z0-9_.]+:)?string/)"
              r"(?P<name>[a-z][a-z0-9_]*)"
          )
          LITERAL_STRING_IDENTIFIER_PATTERN = re.compile(
              r"\bgetIdentifier\s*\(\s*(?:name\s*=\s*)?"
              r"(?P<name_quote>['\"])(?P<name>[a-z][a-z0-9_]*)"
              r"(?P=name_quote)\s*,\s*(?:defType\s*=\s*)?"
              r"(?P<type_quote>['\"])string(?P=type_quote)",
              re.DOTALL,
          )
          DYNAMIC_STRING_IDENTIFIER_PATTERN = re.compile(
              r"\bgetIdentifier\s*\(\s*(?:name\s*=\s*)?"
              r"(?!['\"][a-z][a-z0-9_]*['\"]\s*,)"
              r"[^,\r\n]+,\s*(?:defType\s*=\s*)?"
              r"(?P<quote>['\"])string(?P=quote)",
              re.DOTALL,
          )
          STRING_NAME_PROPERTY_PATTERN = re.compile(
              r"\bstringResourceName['\"]?\s*(?::|=)\s*"
              r"(?P<quote>['\"])(?P<name>[a-z][a-z0-9_]*)"
              r"(?P=quote)"
          )
          STRING_REFLECTION_PATTERN = re.compile(
              r"\bR\.string(?:::class|\.class)|"
              r"\bimport\s+[^\r\n;]*R\.string\.\*"
          )
          TOOLS_KEEP_ATTRIBUTE_PATTERN = re.compile(
              r"\btools:keep\s*=\s*(?:\"(?P<double>[^\"]*)\"|"
              r"'(?P<single>[^']*)')",
              re.DOTALL | re.IGNORECASE,
          )
          TOOLS_KEEP_STRING_PATTERN = re.compile(
              r"@(?:[a-zA-Z0-9_.]+:)?string/"
              r"(?P<pattern>[a-z*?][a-z0-9_*?]*)"
          )
          PUBLIC_RESOURCE_PATTERN = re.compile(
              r"<(?:public|java-symbol)(?=[\s/>])"
              r"(?P<attributes>(?:\"[^\"]*\"|'[^']*'|[^'\">])*)"
              r"(?:\s*/?>)",
              re.DOTALL | re.IGNORECASE,
          )


          @dataclass(frozen=True)
          class StringResource:
              path: Path
              name: str
              start: int
              end: int
              is_non_translatable: bool


          def load_resource_documents(root: Path) -> dict[Path, str]:
              documents = {}
              for path in sorted(root.rglob("*.xml")):
                  if any(part in EXCLUDED_DIRECTORIES for part in path.parts):
                      continue
                  if not path.parent.name.startswith("values"):
                      continue
                  if path.parent.parent.name != "res":
                      continue
                  documents[path] = path.read_bytes().decode(
                      "utf-8",
                      errors="surrogateescape",
                  )
              return documents


          def attribute_value(pattern: re.Pattern, attributes: str) -> str | None:
              match = pattern.search(attributes)
              if match is None:
                  return None
              double_value = match.group("double")
              return double_value if double_value is not None else match.group("single")


          def find_string_resources(
              documents: dict[Path, str],
          ) -> tuple[StringResource, ...]:
              resources = []
              for path, text in documents.items():
                  for match in STRING_RESOURCE_PATTERN.finditer(text):
                      if match.group("element") is None:
                          continue
                      attributes = match.group("attributes")
                      tag = match.group("tag").casefold()
                      if tag == "item" and attribute_value(
                          TYPE_ATTRIBUTE_PATTERN,
                          attributes,
                      ) != "string":
                          continue
                      name = attribute_value(NAME_ATTRIBUTE_PATTERN, attributes)
                      if not name:
                          continue
                      resources.append(
                          StringResource(
                              path=path,
                              name=name,
                              start=match.start("element"),
                              end=match.end("element"),
                              is_non_translatable=bool(
                                  NON_TRANSLATABLE_PATTERN.search(attributes)
                              ),
                          )
                      )
              return tuple(resources)


          def find_duplicate_groups(
              documents: dict[Path, str],
          ) -> dict[tuple[Path, str], list[StringResource]]:
              resources = defaultdict(list)
              for resource in find_string_resources(documents):
                  resources[(resource.path.parent, resource.name)].append(resource)
              return {
                  key: entries
                  for key, entries in resources.items()
                  if len(entries) > 1
              }


          def resource_priority(resource: StringResource) -> tuple[bool, str, int]:
              return (
                  resource.path.name.casefold() != "strings.xml",
                  resource.path.as_posix(),
                  resource.start,
              )


          def removal_range(text: str, resource: StringResource) -> tuple[int, int]:
              line_start = text.rfind("\n", 0, resource.start) + 1
              next_newline = text.find("\n", resource.end)
              line_end = len(text) if next_newline == -1 else next_newline + 1
              if (
                  not text[line_start:resource.start].strip()
                  and not text[resource.end:line_end].strip()
              ):
                  return line_start, line_end
              return resource.start, resource.end


          def remove_resources(
              documents: dict[Path, str],
              resources: tuple[StringResource, ...],
          ) -> tuple[dict[Path, str], int]:
              removals = defaultdict(list)
              for resource in resources:
                  removals[resource.path].append(resource)

              updated_documents = dict(documents)
              removed_count = 0
              for path, duplicates in removals.items():
                  text = updated_documents[path]
                  ranges = [removal_range(text, duplicate) for duplicate in duplicates]
                  for start, end in sorted(ranges, reverse=True):
                      text = text[:start] + text[end:]
                      removed_count += 1
                  updated_documents[path] = text
              return updated_documents, removed_count


          def remove_duplicates(
              documents: dict[Path, str],
              duplicate_groups: dict[tuple[Path, str], list[StringResource]],
          ) -> tuple[dict[Path, str], int]:
              duplicates = tuple(
                  duplicate
                  for entries in duplicate_groups.values()
                  for duplicate in sorted(entries, key=resource_priority)[1:]
              )
              return remove_resources(documents, duplicates)


          def display_identifier(directory: Path, name: str) -> str:
              qualifier = directory.name.removeprefix("values").removeprefix("-")
              resource_type = "string" if not qualifier else f"string-{qualifier}"
              return f"{resource_type}/{name}"


          def conflict_marker(line: str) -> tuple[str, int] | None:
              marker_line = line.rstrip("\r\n")
              match = CONFLICT_MARKER_PATTERN.fullmatch(marker_line)
              if match is None:
                  return None
              marker = match.group("marker")
              if marker.startswith("=") and marker_line != marker:
                  raise ValueError("Conflict separator cannot contain a label.")
              return marker[0], len(marker)


          def flatten_conflicts(path: Path, text: str) -> tuple[str, int]:
              output = []
              state = "outside"
              marker_size = 0
              conflict_start_line = 0
              conflict_count = 0

              for line_number, line in enumerate(text.splitlines(keepends=True), start=1):
                  marker = conflict_marker(line)
                  if state == "outside":
                      if marker is None:
                          output.append(line)
                      elif marker[0] == "<":
                          state = "current"
                          marker_size = marker[1]
                          conflict_start_line = line_number
                      else:
                          raise ValueError(
                              f"Unexpected conflict marker in {path}:{line_number}."
                          )
                  elif marker is None:
                      if state != "ancestor":
                          output.append(line)
                  elif marker[1] != marker_size:
                      raise ValueError(
                          f"Mismatched conflict marker width in {path}:{line_number}."
                      )
                  elif state == "current" and marker[0] == "|":
                      state = "ancestor"
                  elif state in {"current", "ancestor"} and marker[0] == "=":
                      state = "incoming"
                  elif state == "incoming" and marker[0] == ">":
                      state = "outside"
                      marker_size = 0
                      conflict_count += 1
                  else:
                      raise ValueError(
                          f"Malformed conflict block in {path}:{line_number}."
                      )

              if state != "outside":
                  raise ValueError(
                      f"Unclosed conflict block in {path}:{conflict_start_line}."
                  )
              return "".join(output), conflict_count


          def normalize_conflicts(
              documents: dict[Path, str],
          ) -> tuple[dict[Path, str], int]:
              normalized_documents = {}
              conflict_count = 0
              for path, text in documents.items():
                  normalized_text, file_conflict_count = flatten_conflicts(path, text)
                  normalized_documents[path] = normalized_text
                  conflict_count += file_conflict_count
              return normalized_documents, conflict_count


          def load_tracked_files(repository_root: Path) -> tuple[Path, ...]:
              result = subprocess.run(
                  ["git", "ls-files", "-z"],
                  cwd=repository_root,
                  check=True,
                  capture_output=True,
              )
              paths = []
              for encoded_path in result.stdout.split(b"\0"):
                  if not encoded_path:
                      continue
                  path = repository_root / Path(os.fsdecode(encoded_path))
                  if path.is_file():
                      paths.append(path)
              return tuple(paths)


          def find_string_references(text: str, candidates: set[str]) -> set[str]:
              references = {
                  match.group("name")
                  for match in STRING_REFERENCE_PATTERN.finditer(text)
              }
              references.update(
                  match.group("name")
                  for match in LITERAL_STRING_IDENTIFIER_PATTERN.finditer(text)
              )
              references.update(
                  match.group("name")
                  for match in STRING_NAME_PROPERTY_PATTERN.finditer(text)
              )
              return references & candidates


          def find_public_string_names(text: str, candidates: set[str]) -> set[str]:
              public_names = set()
              for match in PUBLIC_RESOURCE_PATTERN.finditer(text):
                  attributes = match.group("attributes")
                  resource_type = attribute_value(TYPE_ATTRIBUTE_PATTERN, attributes)
                  if resource_type is None or resource_type.casefold() != "string":
                      continue
                  name = attribute_value(NAME_ATTRIBUTE_PATTERN, attributes)
                  if name in candidates:
                      public_names.add(name)
              return public_names


          def find_tools_keep_string_names(
              text: str,
              candidates: set[str],
          ) -> set[str]:
              kept_names = set()
              for attribute_match in TOOLS_KEEP_ATTRIBUTE_PATTERN.finditer(text):
                  value = (
                      attribute_match.group("double")
                      if attribute_match.group("double") is not None
                      else attribute_match.group("single")
                  )
                  for pattern_match in TOOLS_KEEP_STRING_PATTERN.finditer(value):
                      pattern = pattern_match.group("pattern")
                      kept_names.update(
                          name for name in candidates if fnmatchcase(name, pattern)
                      )
              return kept_names


          def text_outside_resources(
              text: str,
              resources: list[StringResource],
          ) -> str:
              chunks = []
              cursor = 0
              for resource in sorted(resources, key=lambda item: item.start):
                  chunks.append(text[cursor:resource.start])
                  cursor = resource.end
              chunks.append(text[cursor:])
              return "".join(chunks)


          def find_unused_string_names(
              repository_root: Path,
              documents: dict[Path, str],
          ) -> tuple[str, ...]:
              app_documents = {
                  path: text
                  for path, text in documents.items()
                  if path.is_relative_to(APP_SOURCE_DIRECTORY)
              }
              resources = find_string_resources(app_documents)
              candidate_names = {resource.name for resource in resources}
              if not candidate_names:
                  return ()

              resources_by_path = defaultdict(list)
              dependencies = defaultdict(set)
              roots = {
                  resource.name
                  for resource in resources
                  if resource.is_non_translatable
              }
              for resource in resources:
                  resources_by_path[resource.path].append(resource)
                  element = app_documents[resource.path][resource.start:resource.end]
                  dependencies[resource.name].update(
                      find_string_references(element, candidate_names)
                  )

              preserve_all = False
              for path, text in app_documents.items():
                  outside_text = text_outside_resources(
                      text,
                      resources_by_path[path],
                  )
                  roots.update(find_string_references(outside_text, candidate_names))
                  roots.update(find_public_string_names(outside_text, candidate_names))
                  roots.update(
                      find_tools_keep_string_names(outside_text, candidate_names)
                  )

              for path in load_tracked_files(repository_root):
                  if not path.is_relative_to(APP_SOURCE_DIRECTORY):
                      continue
                  if path in app_documents:
                      continue
                  text = path.read_bytes().decode("utf-8", errors="surrogateescape")
                  roots.update(find_string_references(text, candidate_names))
                  if (
                      STRING_REFLECTION_PATTERN.search(text)
                      or DYNAMIC_STRING_IDENTIFIER_PATTERN.search(text)
                  ):
                      preserve_all = True

              if preserve_all:
                  print(
                      "Dynamic string lookup, reflection, or a wildcard string import "
                      "was detected; "
                      "skipping unused string deletion."
                  )
                  return ()

              reachable = set(roots)
              pending = deque(roots)
              while pending:
                  for dependency in dependencies[pending.popleft()]:
                      if dependency not in reachable:
                          reachable.add(dependency)
                          pending.append(dependency)

              return tuple(sorted(candidate_names - reachable))


          def remove_unused_strings(
              documents: dict[Path, str],
              unused_names: tuple[str, ...],
          ) -> tuple[dict[Path, str], int]:
              names = set(unused_names)
              unused_resources = tuple(
                  resource
                  for resource in find_string_resources(documents)
                  if resource.path.is_relative_to(APP_SOURCE_DIRECTORY)
                  and resource.name in names
              )
              return remove_resources(documents, unused_resources)


          arguments = set(sys.argv[1:])
          if arguments - {"--dry-run"}:
              raise SystemExit(f"Unsupported arguments: {sorted(arguments)}")

          dry_run = "--dry-run" in arguments
          repository_root = Path(".")
          original_documents = load_resource_documents(repository_root)
          normalized_documents, conflict_count = normalize_conflicts(
              original_documents
          )
          print(f"Found {conflict_count} Git conflict block(s).")

          duplicate_groups = find_duplicate_groups(normalized_documents)
          print(f"Found {len(duplicate_groups)} duplicate string resource key(s).")
          if duplicate_groups:
              for (directory, name), entries in sorted(
                  duplicate_groups.items(),
                  key=lambda item: (item[0][0].as_posix(), item[0][1]),
              ):
                  ordered_entries = sorted(entries, key=resource_priority)
                  print(f"[{display_identifier(directory, name)}]")
                  print(f"  Keeping: {ordered_entries[0].path.as_posix()}")
                  for duplicate in ordered_entries[1:]:
                      print(f"  Removing: {duplicate.path.as_posix()}")

          deduplicated_documents, duplicate_count = remove_duplicates(
              normalized_documents,
              duplicate_groups,
          )

          unused_names = find_unused_string_names(
              repository_root,
              deduplicated_documents,
          )
          print(f"Found {len(unused_names)} unused string resource key(s).")
          for name in unused_names:
              print(f"  Removing: string/{name}")

          updated_documents, unused_entry_count = remove_unused_strings(
              deduplicated_documents,
              unused_names,
          )

          _, remaining_conflicts = normalize_conflicts(updated_documents)
          if remaining_conflicts:
              print("Git conflict markers remain after cleanup.")
              raise SystemExit(1)

          remaining_duplicates = find_duplicate_groups(updated_documents)
          if remaining_duplicates:
              print("Duplicate string resources remain after cleanup.")
              for directory, name in sorted(remaining_duplicates):
                  print(f"  [{display_identifier(directory, name)}]")
              raise SystemExit(1)

          remaining_unused = find_unused_string_names(
              repository_root,
              updated_documents,
          )
          if remaining_unused:
              print("Unused string resources remain after cleanup.")
              for name in remaining_unused:
                  print(f"  string/{name}")
              raise SystemExit(1)

          changed_paths = tuple(
              path
              for path, updated_text in updated_documents.items()
              if updated_text != original_documents[path]
          )

          if not dry_run:
              for path in changed_paths:
                  path.write_bytes(
                      updated_documents[path].encode(
                          "utf-8",
                          errors="surrogateescape",
                      )
                  )

              persisted_documents = load_resource_documents(repository_root)
              _, persisted_conflicts = normalize_conflicts(persisted_documents)
              if persisted_conflicts:
                  print("Git conflict markers remain on disk after cleanup.")
                  raise SystemExit(1)
              persisted_duplicates = find_duplicate_groups(persisted_documents)
              if persisted_duplicates:
                  print("Duplicate string resources remain on disk after cleanup.")
                  raise SystemExit(1)
              persisted_unused = find_unused_string_names(
                  repository_root,
                  persisted_documents,
              )
              if persisted_unused:
                  print("Unused string resources remain on disk after cleanup.")
                  raise SystemExit(1)

          mode = "Would update" if dry_run else "Updated"
          print(f"{mode} {len(changed_paths)} string resource file(s).")
          print(f"Normalized {conflict_count} Git conflict block(s).")
          print(f"Removed {duplicate_count} duplicate string resource entries.")
          print(
              f"Removed {unused_entry_count} entries for "
              f"{len(unused_names)} unused string resource key(s)."
          )
          PY

      - name: Remove unused drawable resources
        run: |
          python3 <<'PY'
          from collections import defaultdict, deque
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          DRAWABLE_DIRECTORY = Path("app/src/main/res/drawable")
          DRAWABLE_REFERENCE_PATTERN = re.compile(
              rb"(?:\bR\.drawable\.|@(?:[a-zA-Z0-9_.]+:)?drawable/)"
              rb"(?P<name>[a-z][a-z0-9_]*)"
          )
          LITERAL_GET_IDENTIFIER_PATTERN = re.compile(
              rb"\bgetIdentifier\s*\(\s*(?:name\s*=\s*)?"
              rb"(?P<name_quote>['\"])(?P<name>[a-z][a-z0-9_]*)"
              rb"(?P=name_quote)\s*,\s*(?:defType\s*=\s*)?"
              rb"(?P<type_quote>['\"])drawable(?P=type_quote)",
              re.DOTALL,
          )
          DRAWABLE_NAME_PROPERTY_PATTERN = re.compile(
              rb"\bdrawableResourceName['\"]?\s*(?::|=)\s*"
              rb"(?P<quote>['\"])(?P<name>[a-z][a-z0-9_]*)"
              rb"(?P=quote)"
          )
          DRAWABLE_REFLECTION_PATTERN = re.compile(
              rb"\bR\.drawable(?:::class|\.class)|"
              rb"\bimport\s+[^\r\n;]*R\.drawable\.\*"
          )


          def drawable_resource_name(path: Path) -> str:
              return path.name.split(".", maxsplit=1)[0]


          def load_drawable_candidates(
              drawable_directory: Path,
          ) -> dict[str, tuple[Path, ...]]:
              if not drawable_directory.is_dir():
                  raise SystemExit(
                      f"Drawable directory does not exist: {drawable_directory}"
                  )

              candidates = defaultdict(list)
              for path in sorted(drawable_directory.iterdir()):
                  if path.is_file():
                      candidates[drawable_resource_name(path)].append(path)
              return {
                  name: tuple(paths)
                  for name, paths in candidates.items()
              }


          def load_tracked_files(repository_root: Path) -> tuple[Path, ...]:
              result = subprocess.run(
                  ["git", "ls-files", "-z"],
                  cwd=repository_root,
                  check=True,
                  capture_output=True,
              )
              paths = []
              for encoded_path in result.stdout.split(b"\0"):
                  if not encoded_path:
                      continue
                  path = repository_root / Path(os.fsdecode(encoded_path))
                  if path.is_file():
                      paths.append(path)
              return tuple(paths)


          def find_references(data: bytes, candidates: set[str]) -> set[str]:
              references = {
                  match.group("name").decode("ascii")
                  for match in DRAWABLE_REFERENCE_PATTERN.finditer(data)
              }
              references.update(
                  match.group("name").decode("ascii")
                  for match in LITERAL_GET_IDENTIFIER_PATTERN.finditer(data)
              )
              references.update(
                  match.group("name").decode("ascii")
                  for match in DRAWABLE_NAME_PROPERTY_PATTERN.finditer(data)
              )
              return references & candidates


          def find_unused_drawables(
              repository_root: Path,
              drawable_directory: Path,
              candidates: dict[str, tuple[Path, ...]],
          ) -> tuple[str, ...]:
              candidate_names = set(candidates)
              roots = set()
              dependencies = defaultdict(set)
              preserve_all = False

              for path in load_tracked_files(repository_root):
                  data = path.read_bytes()
                  references = find_references(data, candidate_names)
                  if path.parent == drawable_directory:
                      dependencies[drawable_resource_name(path)].update(references)
                  else:
                      roots.update(references)
                      if DRAWABLE_REFLECTION_PATTERN.search(data):
                          preserve_all = True

              if preserve_all:
                  print(
                      "Drawable reflection or a wildcard drawable import was detected; "
                      "skipping drawable deletion."
                  )
                  return ()

              reachable = set(roots)
              pending = deque(roots)
              while pending:
                  for dependency in dependencies[pending.popleft()]:
                      if dependency not in reachable:
                          reachable.add(dependency)
                          pending.append(dependency)

              return tuple(sorted(candidate_names - reachable))


          arguments = set(sys.argv[1:])
          if arguments - {"--dry-run"}:
              raise SystemExit(f"Unsupported arguments: {sorted(arguments)}")

          dry_run = "--dry-run" in arguments
          repository_root = Path(".")
          drawable_directory = repository_root / DRAWABLE_DIRECTORY
          candidates = load_drawable_candidates(drawable_directory)
          unused_drawables = find_unused_drawables(
              repository_root,
              drawable_directory,
              candidates,
          )

          if not unused_drawables:
              print("No unused drawable resources found.")
              raise SystemExit(0)

          mode = "Would remove" if dry_run else "Removing"
          removed_files = 0
          for name in unused_drawables:
              for path in candidates[name]:
                  print(f"{mode}: {path.as_posix()}")
                  if not dry_run:
                      path.unlink()
                  removed_files += 1

          if not dry_run:
              remaining_candidates = load_drawable_candidates(drawable_directory)
              remaining_unused = find_unused_drawables(
                  repository_root,
                  drawable_directory,
                  remaining_candidates,
              )
              if remaining_unused:
                  print("Unused drawable resources remain after cleanup.")
                  for name in remaining_unused:
                      print(f"  drawable/{name}")
                  raise SystemExit(1)

          action = "Would remove" if dry_run else "Removed"
          print(
              f"{action} {removed_files} file(s) for "
              f"{len(unused_drawables)} unused drawable resource(s)."
          )
          PY

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Clean up Android resources
